[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glinert4"
version = "1.0.1"
description = "GLiNER2 entity detection on an NVIDIA T4: fused DeBERTa attention, an exact count head and a pipelined detector."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.14.1",
    "gliner2[local]==2.1.0",
    "disentangled-flash==1.1.1",
    "pyahocorasick==2.3.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ninja==1.13.2"]

[tool.uv]
environments = ["python_full_version >= '3.11'"]

[tool.setuptools.packages.find]
where = ["."]
include = ["glinert4*"]

[tool.setuptools.package-data]
glinert4 = ["csrc/*.cu", "csrc/*.cpp", "_glinert4.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]
