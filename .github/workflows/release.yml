name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --frozen
      - run: uv run pytest

  wheel:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: |
          docker run --rm -v "$PWD:/src" -w /src -e TORCH_CUDA_ARCH_LIST=7.5 -e PYTHONPATH=/src nvidia/cuda:12.6.3-devel-ubuntu22.04 bash -ec "
            apt-get update && apt-get install -y --no-install-recommends python3.10-dev python3-pip
            pip install --no-cache-dir torch==2.14.1+cu126 --index-url https://download.pytorch.org/whl/cu126
            pip install --no-cache-dir ninja==1.13.2 pyahocorasick==2.3.1 setuptools==84.2.1 wheel==0.48.0
            python3 scripts/build_kernels.py
            ldd glinert4/_glinert4.so | grep libcudart.so.12
            pip wheel --no-deps --no-build-isolation -w dist .
          "
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*.whl
